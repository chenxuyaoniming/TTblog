name: Deploy VuePress Site

on:
  push:
    branches:
      - main  # 触发分支，根据实际调整

  workflow_dispatch:  # 支持手动触发

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个部署同时进行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # VuePress 需要 git 历史获取最后更新时间

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm list vue vue-template-compiler vue-server-renderer vuepress

      - name: Build VuePress site
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider"
          export NODE_ENV="production"
          node node_modules/vuepress/cli.js build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          # 提前启用 Node.js 24（可选，2026年6月后自动）
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
